
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NammaMeet</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <div>
            <h1>NammaMeet</h1>
            <p id="subtitle">Meet and chat with strangers</p>
        </div>

        <div>
            <label id="languageLabel" for="language">Language:</label>
            <select id="language">
                <option value="en">English</option>
                <option value="ta">தமிழ்</option>
            </select>
        </div>
    </header>

    <main class="main-layout">

        <!-- VIDEO SECTION -->
        <section class="video-section">

            <div class="video-box">
                <video id="localVideo" autoplay muted playsinline></video>
                <p id="youLabel">You</p>
            </div>

            <div class="video-box">
                <video id="remoteVideo" autoplay playsinline></video>
                <p id="strangerLabel">Stranger</p>
            </div>

            <div class="video-controls">
                <button id="startBtn">Start</button>
                <button id="nextBtn" disabled>Next Stranger</button>
            </div>

        </section>

        <!-- TEXT CHAT SECTION -->
        <section class="chat-section">

            <h2 id="chatTitle">Text Chat</h2>

            <p id="status">Click Start to find a stranger.</p>

            <div id="chatBox">
                <p id="welcomeMessage">
                    Welcome to NammaMeet! Click Start to connect with a stranger.
                </p>
            </div>

            <div class="message-area">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    disabled
                    autocomplete="off"
                >

                <button id="sendBtn" disabled>Send</button>
            </div>

            <!-- SAFETY BUTTONS -->
            <div class="safety-buttons">
                <button id="endChatBtn" disabled>End Chat</button>
                <button id="reportBtn" disabled>Report User</button>
                <button id="blockBtn" disabled>Block User</button>
            </div>

        </section>

        <!-- EMPTY RIGHT SECTION -->
        <section class="empty-section"></section>

    </main>

    <footer>
        <p>Connect. Chat. Make Friends.</p>
    </footer>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
